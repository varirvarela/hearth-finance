name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run Vitest
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Vite build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:              ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:          ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL:         ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID:           ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:       ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID:  ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:               ${{ secrets.VITE_FIREBASE_APP_ID }}

  e2e:
    name: E2E Tests (Playwright + Firebase Emulator)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Firebase emulators require Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Cache emulator binaries so they don't re-download on every run (~200 MB).
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase.json') }}

      # Build against the emulator — uses a demo project with fake config values.
      # VITE_USE_EMULATOR=true makes firebase.js call connectAuthEmulator / connectDatabaseEmulator.
      - name: Vite build (emulator mode)
        run: npm run build
        env:
          VITE_USE_EMULATOR:                  'true'
          VITE_FIREBASE_API_KEY:              'demo-key'
          VITE_FIREBASE_AUTH_DOMAIN:          'demo-hearth.firebaseapp.com'
          VITE_FIREBASE_DATABASE_URL:         'https://demo-hearth-default-rtdb.firebaseio.com'
          VITE_FIREBASE_PROJECT_ID:           'demo-hearth'
          VITE_FIREBASE_STORAGE_BUCKET:       'demo-hearth.appspot.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID:  '000000000000'
          VITE_FIREBASE_APP_ID:               '1:000000000000:web:0000000000000000'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # firebase emulators:exec starts Auth + RTDB emulators, waits for them to be
      # ready, runs the inner command, then shuts them down cleanly.
      - name: Run Playwright tests (with emulators)
        run: npx firebase emulators:exec --project demo-hearth --only auth,database "npx playwright test e2e/household.spec.js"
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
