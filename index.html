<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="description" content="Hearth Finance — household budgeting and account tracking" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hearth" />
  <title>Hearth Finance</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/app/styles.css" />
</head>
<body>

  <!-- Reusable SVG icon symbols -->
  <svg width="0" height="0" style="display:none;position:absolute" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="ic-dash" viewBox="0 0 20 20">
        <rect x="2" y="2" width="7.5" height="9" rx="1.5" fill="currentColor"/>
        <rect x="10.5" y="2" width="7.5" height="4.5" rx="1.5" fill="currentColor" opacity="0.6"/>
        <rect x="10.5" y="8" width="7.5" height="10" rx="1.5" fill="currentColor" opacity="0.6"/>
        <rect x="2" y="12.5" width="7.5" height="5.5" rx="1.5" fill="currentColor" opacity="0.6"/>
      </symbol>
      <symbol id="ic-txn" viewBox="0 0 20 20">
        <circle cx="3.5" cy="5.5" r="1.3" fill="currentColor"/>
        <circle cx="3.5" cy="10" r="1.3" fill="currentColor"/>
        <circle cx="3.5" cy="14.5" r="1.3" fill="currentColor" opacity="0.5"/>
        <line x1="7" y1="5.5" x2="17" y2="5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="7" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="7" y1="14.5" x2="13" y2="14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
      </symbol>
      <symbol id="ic-bud" viewBox="0 0 20 20">
        <rect x="2" y="13" width="4" height="6" rx="1" fill="currentColor" opacity="0.55"/>
        <rect x="8" y="7" width="4" height="12" rx="1" fill="currentColor" opacity="0.8"/>
        <rect x="14" y="3" width="4" height="16" rx="1" fill="currentColor"/>
        <line x1="1" y1="10" x2="19" y2="10" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="ic-acct" viewBox="0 0 20 20">
        <rect x="4" y="4" width="14" height="8.5" rx="2" fill="currentColor" opacity="0.35"/>
        <rect x="2" y="7" width="14" height="8.5" rx="2" fill="currentColor"/>
        <rect x="4.5" y="10" width="3" height="2" rx="0.5" fill="white"/>
        <line x1="2" y1="13" x2="16" y2="13" stroke="white" stroke-width="1.4" opacity="0.6"/>
      </symbol>
      <symbol id="ic-auto" viewBox="0 0 20 20">
        <line x1="2" y1="5" x2="18" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="2" y1="10" x2="18" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="2" y1="15" x2="18" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="7" cy="5" r="2.5" fill="white" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="13" cy="10" r="2.5" fill="white" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="9" cy="15" r="2.5" fill="white" stroke="currentColor" stroke-width="1.5"/>
      </symbol>
      <symbol id="ic-ins" viewBox="0 0 20 20">
        <path d="M10 1.5L12.2 7.8H18.5L13.6 11.5L15.5 18L10 14.3L4.5 18L6.4 11.5L1.5 7.8H7.8Z" fill="currentColor" opacity="0.85"/>
      </symbol>
    </defs>
  </svg>

  <!-- Auth screen -->
  <div id="auth-screen">
    <div class="auth-hero">
      <div class="auth-brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64" style="display:block">
          <rect width="100" height="100" rx="22" fill="#16a34a"/>
          <rect x="16" y="47" width="15" height="42" rx="6" fill="white"/>
          <rect x="69" y="47" width="15" height="42" rx="6" fill="white"/>
          <path d="M23.5 53 Q23.5 14 50 14 Q76.5 14 76.5 53" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M50 82 C43 75 42 65 47 60 C48 66 50 63 50 57 C53 63 52 66 53 60 C58 65 57 75 50 82Z" fill="white"/>
        </svg>
      </div>
      <h1 class="auth-name">Hearth</h1>
      <p class="auth-tagline">Your household finances, together.</p>
    </div>
    <div class="auth-card">
      <button id="sign-in-google" class="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.013 17.64 11.705 17.64 9.2z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
      <div class="divider">or</div>
      <form id="auth-form" style="display:contents">
        <input type="email" id="auth-email" placeholder="Email address" autocomplete="email" required />
        <input type="password" id="auth-password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required />
        <button id="sign-in-email" class="btn-primary" type="submit">Sign In</button>
        <button id="sign-up-email" class="btn-ghost" type="button">Create Account</button>
      </form>
    </div>
  </div>

  <!-- App shell (hidden until auth) -->
  <div id="app-shell" hidden>
    <main id="main"></main>
    <nav class="bottom-nav">
      <div class="nav-brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="nav-brand-icon" aria-hidden="true">
          <rect width="100" height="100" rx="22" fill="#16a34a"/>
          <rect x="16" y="47" width="15" height="42" rx="6" fill="white"/>
          <rect x="69" y="47" width="15" height="42" rx="6" fill="white"/>
          <path d="M23.5 53 Q23.5 14 50 14 Q76.5 14 76.5 53" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M50 82 C43 75 42 65 47 60 C48 66 50 63 50 57 C53 63 52 66 53 60 C58 65 57 75 50 82Z" fill="white"/>
        </svg>
        Hearth
      </div>
      <button class="nav-tab active" data-tab="dashboard">
        <svg class="nav-icon" aria-hidden="true"><use href="#ic-dash"/></svg>
        <span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-tab" data-tab="transactions">
        <svg class="nav-icon" aria-hidden="true"><use href="#ic-txn"/></svg>
        <span class="nav-label">Transactions</span>
      </button>
      <button class="nav-tab" data-tab="budgets">
        <svg class="nav-icon" aria-hidden="true"><use href="#ic-bud"/></svg>
        <span class="nav-label">Budgets</span>
      </button>
      <button class="nav-tab" data-tab="accounts">
        <svg class="nav-icon" aria-hidden="true"><use href="#ic-acct"/></svg>
        <span class="nav-label">Accounts</span>
      </button>
      <button class="nav-tab" data-tab="insights">
        <svg class="nav-icon" aria-hidden="true"><use href="#ic-ins"/></svg>
        <span class="nav-label">Insights</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/src/app/app.js"></script>
</body>
</html>
