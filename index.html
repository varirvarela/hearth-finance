<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="description" content="Hearth Finance — household budgeting and account tracking" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hearth" />
  <title>Hearth Finance</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/app/styles.css" />
</head>
<body>
  <!-- Auth screen -->
  <div id="auth-screen">
    <div class="auth-hero">
      <div class="auth-brand">🏠</div>
      <h1 class="auth-name">Hearth</h1>
      <p class="auth-tagline">Your household finances, together.</p>
    </div>
    <div class="auth-card">
      <button id="sign-in-google" class="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.013 17.64 11.705 17.64 9.2z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
      <div class="divider">or</div>
      <form id="auth-form" style="display:contents">
        <input type="email" id="auth-email" placeholder="Email address" autocomplete="email" required />
        <input type="password" id="auth-password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required />
        <button id="sign-in-email" class="btn-primary" type="submit">Sign In</button>
        <button id="sign-up-email" class="btn-ghost" type="button">Create Account</button>
      </form>
    </div>
  </div>

  <!-- App shell (hidden until auth) -->
  <div id="app-shell" hidden>
    <main id="main"></main>
    <nav class="bottom-nav">
      <button class="nav-tab active" data-tab="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-tab" data-tab="transactions">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Transactions</span>
      </button>
      <button class="nav-tab" data-tab="budgets">
        <span class="nav-icon">🎯</span>
        <span class="nav-label">Budgets</span>
      </button>
      <button class="nav-tab" data-tab="accounts">
        <span class="nav-icon">🏦</span>
        <span class="nav-label">Accounts</span>
      </button>
      <button class="nav-tab" data-tab="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/src/app/app.js"></script>
</body>
</html>
